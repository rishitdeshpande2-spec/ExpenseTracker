{% extends "finance/base.html" %}
{% block title %}Categories - Expense Tracker{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Categories</h1>
    <a href="{% url 'category_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Category</a>
</div>
<div class="row g-3">
    {% for category in categories %}
    <div class="col-md-4">
        <div class="card p-3 d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <span class="category-dot" style="background: {{ category.color }}; width: 16px; height: 16px;"></span>
                <span class="fw-medium">{{ category.name }}</span>
            </div>
            <a href="{% url 'category_delete' category.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center text-muted py-4">No categories yet</div>
    {% endfor %}
</div>
{% endblock %}
